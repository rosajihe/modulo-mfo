{% extends 'biblioteca/base.html' %}

{% block content %}
<h2>Lista de Autores</h2>

{% if autores %}
    <ul>
        {% for autor in autores %}
            <li>
                <a href="{% url 'biblioteca:detalle_autor' autor.id %}">
                    {{ autor.nombre }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No hay autores registrados en este momento.</p>
{% endif %}
{% endblock %}
