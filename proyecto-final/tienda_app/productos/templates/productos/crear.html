{% extends 'productos/base.html' %}

{% block content %}

<h1>Nuevo Producto</h1>

    {% csrf_token %}

</form>
<div class="cont-return">
<a href="{% url 'productos:productos_listado' %}" class="btn-return">Volver al listado ↩️</a>
</div>
{% endblock %}
